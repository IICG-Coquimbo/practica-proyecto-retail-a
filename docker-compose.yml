version: '3.8'

services:
  # Base de Datos Local (Necesaria para cumplir con 'Volumes' del Hito 1)
  mongodb:
    image: mongo:latest
    container_name: BigData_MongoDB
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
    networks:
      - bigdata_net

  workspace:
    build: .
    container_name: BigData_workspace
    ports:
      - "8888:8888"   # Jupyter Lab
      - "6080:6080"   # VNC
      - "4040:4040"   # Spark UI
      - "8501:8501"   # Streamlit
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    dns:
      - 8.8.8.8
    user: root
    restart: always
    networks:
      - bigdata_net

  visualizer:
    image: mongo-express:latest
    container_name: BigData_Visualizer
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb+srv://FelipeGutierrez:pepe1516@cluster0.6zjv54l.mongodb.net/test?retryWrites=true&w=majority
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      # Esta es la variable correcta para aceptar la conexión de Atlas sin errores de SSL
      - ME_CONFIG_MONGODB_SSL=true
      - ME_CONFIG_MONGODB_SSL_VALIDATE=false
    networks:
      - bigdata_net
    depends_on:
      - mongodb

  filebrowser:
    image: filebrowser/filebrowser
    container_name: BigData_FileBrowser
    ports:
      - "8082:80"
    volumes:
      - .:/srv
    restart: always
    networks:
      - bigdata_net

networks:
  bigdata_net:
    driver: bridge
    name: BigData_Network_UCN